# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imc-unknown-none-elf]
# 80 MHz QIO flash (espflash defaults to 40 MHz DIO): boot to first advert ~246 -> ~205 ms, draws ~10 % faster.
# `espflash monitor` to watch serial; tools/drawtime.py needs the port free.
runner = "espflash flash --chip esp32c3 --flash-freq 80mhz --flash-mode qio"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"
