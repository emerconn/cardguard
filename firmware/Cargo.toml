[package]
edition      = "2024"
name         = "cardguard"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "cardguard"
path = "src/main.rs"

[dependencies]
guards = { path = "../guards" }

esp-hal = { version = "~1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["ble", "esp-alloc", "esp32c3", "log-04", "unstable"] }
esp-storage = { version = "0.10.0", features = ["esp32c3"] }
esp-radio-rtos-driver = "0.4.2" # task_create: the BLE thread (esp-rtos has no public thread API)
log = "0.4.27"

bt-hci = "0.9.0"
trouble-host = { version = "0.7.0", features = ["gatt"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-io-async = "0.7.0"

bytemuck = "1.25"
critical-section = "1.2.0"
heapless = "0.9"
portable-atomic = { version = "1.11", default-features = false } # the C3 has no atomic read-modify-write; esp-hal makes it single-core safe
static_cell = "2.1.1"

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug         = 2 # only in the ELF, never flashed
lto           = 'fat'
opt-level     = 's'

[profile.release.package.guards]
opt-level = 3 # the pixel loops: speed over size, like the C++ renderer's -O2
