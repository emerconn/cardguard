<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cardguard</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { --bg: #111; --fg: #f4eede; --gold: #e8b84a; --card: #1e1e1e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.4 -apple-system, system-ui, sans-serif; max-width: 480px; margin-inline: auto; }
  h1 { color: var(--gold); font-size: 28px; margin: 0 0 4px; }
  button { display: block; width: 100%; padding: 16px; margin: 0 0 10px; border-radius: 12px;
           font: inherit; font-weight: 600; text-align: left; cursor: pointer;
           background: var(--card); color: var(--fg); border: 2px solid #333; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--gold); color: var(--gold); }
  #connect { background: var(--gold); color: #111; border: 0; text-align: center; }
  #connect.off { background: transparent; color: var(--fg); border: 2px solid #333; }
  #light { margin: 8px 0 24px; }
  #light.off { opacity: .4; }
  #light label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
  #light input { width: 100%; accent-color: var(--gold); }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { margin: 0; }
  #logToggle { display: inline-block; width: auto; margin: 0; padding: 6px 14px; border-radius: 999px;
               font-size: 15px; text-align: center; }
  #logToggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  #log { margin: 14px 0 0; padding: 12px; max-height: 40vh; overflow: auto; border-radius: 12px;
         background: #000; border: 2px solid #333; font: 12px/1.45 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; word-break: break-word; }
  #log:empty::before { content: 'no log lines yet; they show up as the board sends them'; opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>cardguard</h1>
  <button id="logToggle" aria-pressed="false">debug</button>
</header>
<button id="connect">connect</button>
<div id="light" hidden>
  <label for="bright">brightness <span id="pct"></span></label>
  <input id="bright" type="range" min="10" max="100" step="5">
</div>
<div id="guards"></div>
<pre id="log" hidden></pre>

<script>
// Must match the firmware (firmware/src/main.rs).
const SERVICE = '9a49e65d-c7e4-4d64-a03d-061e26e9b26a';
const SELECT = '6eeb6fbb-9458-47d6-9379-e73cab7dfa04';
const NAMES = 'ab3ba50e-45cb-4145-ae7e-3066f7e872a8';  // guard names, one per line (GUARD_NAMES)
const BRIGHT = '38c7816a-72f6-40eb-b1ab-b01bb0136afc';  // backlight percent 10-100, one byte
const LOG = '7c0bd792-ba8a-4791-be95-3c354c4c2fd2';     // board log lines, as notifications
const VERSION = '30598302-24ed-4ff4-8c09-c9091182cab0'; // firmware version text (git tag)
const APP_VERSION = 'dev';  // replaced by the release tag at deploy (pages.yml)

// Debug mode: the log panel, and the versions (the app's on the toggle, the board's on disconnect).
// Log lines are collected even while hidden; the toggle is remembered in this browser.
const logBox = document.getElementById('log'), logToggle = document.getElementById('logToggle');
function showLog(on) {
  logBox.hidden = !on;
  logToggle.setAttribute('aria-pressed', on);
  logToggle.textContent = on ? APP_VERSION : 'debug';
  connectLabel();
  try { localStorage.setItem('showLog', on ? '1' : ''); } catch (e) {}
  if (on) logBox.scrollTop = logBox.scrollHeight;
}
logToggle.onclick = () => showLog(logBox.hidden);
function addLog(text) {
  const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 20;
  logBox.append(`${new Date().toLocaleTimeString([], { hour12: false })}  ${text}\n`);
  while (logBox.childNodes.length > 300) logBox.firstChild.remove();
  if (atBottom) logBox.scrollTop = logBox.scrollHeight;  // don't yank the view while reading older lines
}
// Board lines arrive as "<boot>.<n> text". On (re)subscribing the board replays its recent lines, so skip
// numbers already shown. A set, not a high-water mark: replayed lines can trail a newer live one.
let logBoot = null, logSeen = new Set();
function boardLog(line) {
  const m = /^([0-9a-f]+)\.(\d+) ([\s\S]*)$/.exec(line);
  if (!m) return addLog(line);  // older firmware: unnumbered
  if (m[1] !== logBoot) { logBoot = m[1]; logSeen = new Set(); }  // board restarted: new numbers
  if (logSeen.has(m[2])) return;
  logSeen.add(m[2]);
  if (logSeen.size > 1000) logSeen.delete(logSeen.values().next().value);  // oldest first
  addLog(m[3]);
}

const list = document.getElementById('guards');
const light = document.getElementById('light');
const slider = document.getElementById('bright'), pct = document.getElementById('pct');
let device = null, select = null, bright = null, names = [], buttons = [];
let boardVersion = '';  // read on each connect
let boardBright = null;  // last brightness the board confirmed (read, or written OK); the slider returns to it on a drop
function showBright(v) { slider.value = v; pct.textContent = v + '%'; }

// Bluefy sometimes rejects with no message (showed as "undefined").
const why = e => (e && (e.message || e.name)) || String(e);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// iOS may never settle a connect to a board that is out of range or asleep: give up instead of waiting forever.
function withTimeout(promise, ms, what) {
  return Promise.race([promise, new Promise((_, no) => setTimeout(() => no(new Error(`${what} timed out`)), ms))]);
}
// A connect still pending after a timeout would otherwise linger; this cancels it.
function cancelPending() { if (device) device.gatt.disconnect(); }

// (Re)connect to the device already picked: no picker needed. Syncs the slider to the board and rebuilds
// the guard buttons from its names; the controls go live only once everything is read.
async function attach() {
  const svc = await (await withTimeout(device.gatt.connect(), 10000, 'connecting')).getPrimaryService(SERVICE);
  select = await svc.getCharacteristic(SELECT);
  bright = await svc.getCharacteristic(BRIGHT);
  boardBright = (await bright.readValue()).getUint8(0);
  showBright(boardBright);
  light.hidden = false;
  try {
    const log = await svc.getCharacteristic(LOG);
    // addEventListener: Bluefy ignored the oncharacteristicvaluechanged property. The flag stops a
    // reconnect that hands back the same object from adding a second listener (doubled lines).
    if (!log.cardguardListening) {
      log.addEventListener('characteristicvaluechanged', e => boardLog(new TextDecoder().decode(e.target.value)));
      log.cardguardListening = true;
    }
    await log.startNotifications();
    addLog('web: subscribed to board log');
  } catch (e) {
    addLog(`web: log unavailable: ${why(e)}`);  // logging must never block connecting
  }
  try {
    boardVersion = new TextDecoder().decode(await (await svc.getCharacteristic(VERSION)).readValue());
  } catch (e) {
    boardVersion = 'unknown';  // firmware before the version characteristic
  }
  names = new TextDecoder().decode(await (await svc.getCharacteristic(NAMES)).readValue()).split('\n');
  list.replaceChildren();
  buttons = names.map((name, i) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => pick(i);
    list.appendChild(b);
    return b;
  });
  // Highlight the guard actually on the board, now and whenever it changes (web app, BOOT button, error redraw).
  highlight((await select.readValue()).getUint8(0));
  try {
    if (!select.cardguardListening) {
      select.addEventListener('characteristicvaluechanged', e => highlight(e.target.value.getUint8(0)));
      select.cardguardListening = true;
    }
    await select.startNotifications();
  } catch (e) {
    addLog(`web: guard updates unavailable: ${why(e)}`);  // the read above still showed the current one
  }
  setConnected(true);
}

// Gold outline on the guard the board shows; none for a number past the end (the board's "NO GUARD" screen).
function highlight(i) {
  buttons.forEach((b, j) => b.classList.toggle('on', j === i));
}

// One button: connect while disconnected, connecting… while trying (a tap or the retries), disconnect
// while connected. While disconnected the guard buttons and slider are frozen, so nothing looks applied that never reached the board. `up` is what
// the page shows; it can go stale when iOS pauses Bluefy and the disconnect event never arrives.
const connectBtn = document.getElementById('connect');
let leaving = false;  // true while the user is disconnecting on purpose
let up = false, connecting = false;
// In debug mode "disconnect" also shows the board's firmware version. Status details go to the debug log.
function connectLabel() {
  connectBtn.textContent = !navigator.bluetooth ? 'open this page in Bluefy'
    : up ? (logBox.hidden ? 'disconnect' : `disconnect · ${boardVersion}`)
    : connecting ? 'connecting…' : 'connect';
  // A tap while trying adds nothing (the retries run every 0.3 s), and a second picker would race the first.
  connectBtn.disabled = !navigator.bluetooth || (connecting && !up);
}
function setConnecting(on) {
  connecting = on;
  connectLabel();
}
function setConnected(on) {
  up = on;
  if (on) connecting = false;  // not on a drop: retries cancel a pending connect, which fires a drop
  connectLabel();
  connectBtn.classList.toggle('off', on);
  buttons.forEach(b => (b.disabled = !on));
  slider.disabled = !on;
  light.classList.toggle('off', !on);
}

// After an unplanned drop (board asleep, reset, out of range), retry while the page is on screen.
// Bounded so a board left asleep doesn't keep the phone busy; after that, the connect button.
// Every 0.3 s: after a connect tap Bluefy rejects at once instead of waiting for the board, so the gap
// between tries adds to the delay after waking. Rejected tries cost next to nothing. The board advertises
// fast right after waking, so it is found within a try or two.
const RETRY_EVERY_MS = 300, RETRY_TRIES = 400;  // about 2 minutes
// Each loop has a number; starting a loop or stopping retries bumps it, which retires the running one,
// so taps and drops never leave two loops going. Each try also picks up a link iOS reconnected by itself
// (Bluefy shows "connected" but the page gets no event for that).
let loop = 0;
const stopRetries = () => loop++;
async function reconnectLoop() {
  const me = ++loop;
  setConnecting(true);
  for (let i = 0; i < RETRY_TRIES && me === loop && !up; i++) {
    if (!document.hidden) {  // iOS pauses Bluefy in the background anyway
      try {
        await attach();
        if (me === loop) addLog('web: reconnected');
        return;
      } catch (e) {
        if (me === loop) cancelPending();
      }
    }
    await sleep(RETRY_EVERY_MS);
  }
  if (me === loop && !up) {
    addLog('web: cardguard not found; gave up retrying');
    setConnecting(false);
  }
}

// Runs from the disconnect event, the disconnect button, a failed write and the resync below; safe to run twice.
function onDrop() {
  const wasUp = up;
  select = null;
  setConnected(false);
  wanted = null;  // a drag still waiting to be sent is dropped with the link
  if (boardBright !== null) showBright(boardBright);  // frozen controls show what the board has, not an unsent drag
  if (leaving) {
    // On purpose: clear the controls and don't reconnect.
    leaving = false;
    stopRetries();
    setConnecting(false);
    list.replaceChildren();
    buttons = [];
    light.hidden = true;
    addLog('web: disconnected');
  } else if (wasUp) {
    addLog('web: connection lost; reconnecting');
    reconnectLoop();
  }
}

// Back from another app: if the link died while Bluefy was paused, show it and start reconnecting.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && up && !device.gatt.connected) onDrop();
});

connectBtn.onclick = async () => {
  if (up) {  // the button says disconnect: always disconnect, never open the picker
    leaving = true;
    if (device.gatt.connected) device.gatt.disconnect();  // its event calls onDrop too; harmless
    onDrop();
    return;
  }
  if (!navigator.bluetooth) return;  // the button already says to open the page in Bluefy
  stopRetries();  // this tap takes over from the background retries
  setConnecting(true);
  try {
    if (!device) {  // the same board again goes straight back, no picker
      device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'cardguard' }], optionalServices: [SERVICE] });
      device.addEventListener('gattserverdisconnected', onDrop);
    }
    await attach();
    addLog('web: connected');
  } catch (e) {
    if (e && e.name === 'NotFoundError') {
      addLog('web: no cardguard picked');
      return setConnecting(false);
    }
    addLog(`web: connect failed: ${why(e)}; retrying`);
    cancelPending();
    reconnectLoop();  // keep trying, so waking the board brings it back without another tap
  }
};

// A write that fails because the link is gone counts as a drop: freeze and reconnect.
function failed(what, e) {
  if (device && !device.gatt.connected) onDrop();
  else addLog(`web: ${what} failed: ${why(e)}`);
}

async function pick(i) {
  if (!up) return;
  try {
    await select.writeValue(new Uint8Array([i]));  // raw byte; the board also accepts text digits
    highlight(i);  // right away; the board's notification confirms it after drawing
  } catch (e) {
    failed('send', e);
  }
}

// Dragging fires many events; only one BLE write runs at a time and the newest value wins.
let wanted = null, sending = false;
slider.oninput = async () => {
  pct.textContent = slider.value + '%';
  wanted = +slider.value;
  if (sending || !up) return;
  sending = true;
  try {
    while (wanted !== null) {
      const v = wanted;
      wanted = null;
      await bright.writeValue(new Uint8Array([v]));
      boardBright = v;
    }
  } catch (e) {
    wanted = null;
    failed('brightness', e);
    showBright(boardBright);  // the slider never shows a level the board didn't take
  } finally {
    sending = false;
  }
};

// Last: showLog relabels the connect button, defined above.
try { showLog(localStorage.getItem('showLog') === '1'); } catch (e) {}
</script>
</body>
</html>
