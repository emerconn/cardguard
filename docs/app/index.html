<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cardguard</title>
<style>
  :root { --bg: #111; --fg: #f4eede; --gold: #e8b84a; --red: #d62828; --card: #1e1e1e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.4 -apple-system, system-ui, sans-serif; max-width: 480px; margin-inline: auto; }
  h1 { color: var(--gold); font-size: 28px; margin: 0 0 4px; }
  #status { margin: 0 0 20px; opacity: .8; }
  button { display: block; width: 100%; padding: 16px; margin: 0 0 10px; border-radius: 12px;
           font: inherit; font-weight: 600; text-align: left; cursor: pointer;
           background: var(--card); color: var(--fg); border: 2px solid #333; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--gold); color: var(--gold); }
  #connect { background: var(--gold); color: #111; border: 0; text-align: center; }
  .err { color: var(--red); }
</style>
</head>
<body>
<h1>cardguard</h1>
<p id="status">Not connected</p>
<button id="connect">Connect</button>
<div id="guards"></div>

<script>
// Must match the firmware (src/main.cpp).
const SERVICE = '9a49e65d-c7e4-4d64-a03d-061e26e9b26a';
const SELECT = '6eeb6fbb-9458-47d6-9379-e73cab7dfa04';
// shortcut: names copied from GUARDS in src/guards.cpp, update both; read them from the board if they drift.
const GUARDS = ['Chip Leader', 'Ducks', 'Jack King Off', 'Donk'];

const status = document.getElementById('status');
const list = document.getElementById('guards');
let device = null, select = null;

function say(msg, isErr) { status.textContent = msg; status.className = isErr ? 'err' : ''; }
// Bluefy sometimes rejects with no message (showed as "undefined").
const why = e => (e && (e.message || e.name)) || String(e);

// (Re)connect to the device already picked: no picker needed.
async function attach() {
  const server = await device.gatt.connect();
  select = await (await server.getPrimaryService(SERVICE)).getCharacteristic(SELECT);
}

const buttons = GUARDS.map((name, i) => {
  const b = document.createElement('button');
  b.textContent = `${i}  ${name}`;
  b.disabled = true;
  b.onclick = () => pick(i);
  list.appendChild(b);
  return b;
});

document.getElementById('connect').onclick = async () => {
  if (!navigator.bluetooth) return say('No Web Bluetooth here. On iPhone open this page in the Bluefy browser.', true);
  try {
    say('Looking for cardguard…');
    const d = await navigator.bluetooth.requestDevice({ filters: [{ name: 'cardguard' }], optionalServices: [SERVICE] });
    if (d !== device) d.addEventListener('gattserverdisconnected', () => { select = null; say('Disconnected. Tap a guard to reconnect.'); });
    device = d;
    await attach();
    buttons.forEach(b => (b.disabled = false));  // stay enabled after a drop: a tap reconnects
    say('Connected. Pick a guard.');
  } catch (e) {
    say(e && e.name === 'NotFoundError' ? 'No cardguard picked. Is its screen on?' : `Connect failed: ${why(e)}`, true);
  }
};

async function pick(i) {
  try {
    if (!select || !device.gatt.connected) { say('Reconnecting…'); await attach(); }
    await select.writeValue(new Uint8Array([i]));  // raw byte; the board also accepts text digits
    buttons.forEach((b, j) => b.classList.toggle('on', j === i));
    say(`Showing ${GUARDS[i]}`);
  } catch (e) {
    select = null;  // next tap tries a fresh connection
    say(`Send failed: ${why(e)}. Tap again, or Connect.`, true);
  }
}
</script>
</body>
</html>
