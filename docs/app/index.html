<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cardguard</title>
<style>
  :root { --bg: #111; --fg: #f4eede; --gold: #e8b84a; --red: #d62828; --card: #1e1e1e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.4 -apple-system, system-ui, sans-serif; max-width: 480px; margin-inline: auto; }
  h1 { color: var(--gold); font-size: 28px; margin: 0 0 4px; }
  #status { margin: 0 0 20px; opacity: .8; }
  button { display: block; width: 100%; padding: 16px; margin: 0 0 10px; border-radius: 12px;
           font: inherit; font-weight: 600; text-align: left; cursor: pointer;
           background: var(--card); color: var(--fg); border: 2px solid #333; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--gold); color: var(--gold); }
  #connect { background: var(--gold); color: #111; border: 0; text-align: center; }
  #connect.off { background: transparent; color: var(--fg); border: 2px solid #333; }
  #light { margin: 8px 0 24px; }
  #light label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
  #light input { width: 100%; accent-color: var(--gold); }
  .err { color: var(--red); }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h1 { margin: 0; }
  #logToggle { display: inline-block; width: auto; margin: 0; padding: 6px 14px; border-radius: 999px;
               font-size: 15px; text-align: center; }
  #logToggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  #log { margin: 14px 0 0; padding: 12px; max-height: 40vh; overflow: auto; border-radius: 12px;
         background: #000; border: 2px solid #333; font: 12px/1.45 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; word-break: break-word; }
  #log:empty::before { content: 'No log lines yet. They appear here as the board sends them.'; opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>cardguard</h1>
  <button id="logToggle" aria-pressed="false">debug</button>
</header>
<p id="status">Not connected</p>
<button id="connect">Connect</button>
<div id="light" hidden>
  <label for="bright">Brightness <span id="pct"></span></label>
  <input id="bright" type="range" min="10" max="100" step="5">
</div>
<div id="guards"></div>
<pre id="log" hidden></pre>

<script>
// Must match the firmware (src/main.cpp).
const SERVICE = '9a49e65d-c7e4-4d64-a03d-061e26e9b26a';
const SELECT = '6eeb6fbb-9458-47d6-9379-e73cab7dfa04';
const NAMES = 'ab3ba50e-45cb-4145-ae7e-3066f7e872a8';  // guard names, one per line (GUARD_NAMES)
const BRIGHT = '38c7816a-72f6-40eb-b1ab-b01bb0136afc';  // backlight percent 10-100, one byte
const LOG = '7c0bd792-ba8a-4791-be95-3c354c4c2fd2';     // board log lines, as notifications

// Log panel: lines are collected even while hidden; the toggle is remembered on this phone.
const logBox = document.getElementById('log'), logToggle = document.getElementById('logToggle');
function showLog(on) {
  logBox.hidden = !on;
  logToggle.setAttribute('aria-pressed', on);
  try { localStorage.setItem('showLog', on ? '1' : ''); } catch (e) {}
  if (on) logBox.scrollTop = logBox.scrollHeight;
}
logToggle.onclick = () => showLog(logBox.hidden);
try { showLog(localStorage.getItem('showLog') === '1'); } catch (e) {}
function addLog(text) {
  const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 20;
  logBox.append(`${new Date().toLocaleTimeString([], { hour12: false })}  ${text}\n`);
  while (logBox.childNodes.length > 300) logBox.firstChild.remove();
  if (atBottom) logBox.scrollTop = logBox.scrollHeight;  // don't yank the view while reading older lines
}

const status = document.getElementById('status');
const list = document.getElementById('guards');
const slider = document.getElementById('bright'), pct = document.getElementById('pct');
let device = null, select = null, bright = null, names = [], buttons = [];

function say(msg, isErr) { status.textContent = msg; status.className = isErr ? 'err' : ''; }
// Bluefy sometimes rejects with no message (showed as "undefined").
const why = e => (e && (e.message || e.name)) || String(e);

// iOS may never settle a connect to a board that is out of range: give up instead of "Reconnecting…" forever.
function withTimeout(promise, ms, what) {
  return Promise.race([promise, new Promise((_, no) => setTimeout(() => no(new Error(`${what} timed out`)), ms))]);
}

// (Re)connect to the device already picked: no picker needed. Rebuilds the buttons from the board's names.
async function attach() {
  const svc = await (await withTimeout(device.gatt.connect(), 10000, 'Connecting')).getPrimaryService(SERVICE);
  select = await svc.getCharacteristic(SELECT);
  bright = await svc.getCharacteristic(BRIGHT);
  slider.value = (await bright.readValue()).getUint8(0);
  pct.textContent = slider.value + '%';
  document.getElementById('light').hidden = false;
  try {
    const log = await svc.getCharacteristic(LOG);
    // addEventListener: Bluefy ignored the oncharacteristicvaluechanged property. The flag stops a
    // reconnect that hands back the same object from adding a second listener (doubled lines).
    if (!log.cardguardListening) {
      log.addEventListener('characteristicvaluechanged', e => addLog(new TextDecoder().decode(e.target.value)));
      log.cardguardListening = true;
    }
    await log.startNotifications();
    addLog('(page) subscribed to board log');
  } catch (e) {
    addLog(`(page) log unavailable: ${why(e)}`);  // logging must never block connecting
  }
  setConnected(true);
  names = new TextDecoder().decode(await (await svc.getCharacteristic(NAMES)).readValue()).split('\n');
  list.replaceChildren();
  buttons = names.map((name, i) => {
    const b = document.createElement('button');
    b.textContent = `${i}  ${name}`;
    b.onclick = () => pick(i);
    list.appendChild(b);
    return b;
  });
}

// One button: Connect while disconnected, Disconnect while connected. `up` is what the page shows;
// it can go stale when iOS pauses Bluefy and the disconnect event never arrives (see visibilitychange).
const connectBtn = document.getElementById('connect');
let leaving = false;  // true while the user is disconnecting on purpose
let up = false;
function setConnected(on) {
  up = on;
  connectBtn.textContent = on ? 'Disconnect' : 'Connect';
  connectBtn.classList.toggle('off', on);
}

// Runs from the disconnect event, the Disconnect button and the resync below; safe to run twice.
function onDrop() {
  const wasUp = up;
  select = null;
  setConnected(false);
  if (leaving) {
    // On purpose: clear the controls so a tap can't quietly reconnect.
    leaving = false;
    list.replaceChildren();
    buttons = [];
    document.getElementById('light').hidden = true;
    say('Disconnected.');
    addLog('(page) disconnected');
  } else if (wasUp) {
    say('Connection dropped. Tap a guard to reconnect.');  // buttons stay: a tap reconnects
    addLog('(page) connection dropped');
  }
}

// Back from another app: if the link died while Bluefy was paused, show it instead of a stale "Disconnect".
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && up && !device.gatt.connected) onDrop();
});

// A reconnect from a tap failed: show Connect, keep the buttons so the next tap tries again.
function markDown() {
  select = null;
  setConnected(false);
  if (device && device.gatt.connected) device.gatt.disconnect();  // cancel a connect still pending after a timeout
}

connectBtn.onclick = async () => {
  if (up) {  // the button says Disconnect: always disconnect, never open the picker
    leaving = true;
    if (device.gatt.connected) device.gatt.disconnect();  // its event calls onDrop too; harmless
    onDrop();
    return;
  }
  if (!navigator.bluetooth) return say('No Web Bluetooth here. On iPhone open this page in the Bluefy browser.', true);
  try {
    say('Looking for cardguard…');
    const d = await navigator.bluetooth.requestDevice({ filters: [{ name: 'cardguard' }], optionalServices: [SERVICE] });
    if (d !== device) d.addEventListener('gattserverdisconnected', onDrop);
    device = d;
    await attach();
    say('Connected. Pick a guard.');
  } catch (e) {
    say(e && e.name === 'NotFoundError' ? 'No cardguard picked. Is its screen on?' : `Connect failed: ${why(e)}`, true);
  }
};

async function pick(i) {
  try {
    if (!select || !device.gatt.connected) { say('Reconnecting…'); await attach(); }
    await select.writeValue(new Uint8Array([i]));  // raw byte; the board also accepts text digits
    buttons.forEach((b, j) => b.classList.toggle('on', j === i));
    say(`Showing ${names[i]}`);
  } catch (e) {
    markDown();  // next tap tries a fresh connection
    say(`Send failed: ${why(e)}. Tap again, or Connect.`, true);
  }
}

// Dragging fires many events; only one BLE write runs at a time and the newest value wins.
let wanted = null, sending = false;
slider.oninput = async () => {
  pct.textContent = slider.value + '%';
  wanted = +slider.value;
  if (sending) return;
  sending = true;
  try {
    while (wanted !== null) {
      const v = wanted;
      wanted = null;
      if (!select || !device.gatt.connected) { say('Reconnecting…'); await attach(); slider.value = v; }
      await bright.writeValue(new Uint8Array([v]));
    }
    say(`Brightness ${slider.value}%`);
  } catch (e) {
    markDown();
    say(`Brightness failed: ${why(e)}. Try again, or Connect.`, true);
  } finally {
    sending = false;
  }
};
</script>
</body>
</html>
