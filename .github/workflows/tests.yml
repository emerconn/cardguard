# Runs on every pull request into main; the main ruleset requires its jobs to pass before merging, so
# main stays tested. Page tests need no dependencies. The hardware smoke test (test/hardware/) needs the
# board, so it runs locally after flashing, not here.
name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]  # edited: fixing a PR title reruns pr-title
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which parts does the PR touch? A required job skipped by `if` counts as passed, so each test job runs
  # only for its own files. Any failure here leaves the outputs empty, and then every job runs.
  changes:  # job ids are the check names the main ruleset requires
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          touches() { grep -qE "$1|^\.github/workflows/tests\.yml$" <<< "$files" && echo true || echo false; }
          echo "rust=$(touches '^(firmware|guards)/')" >> "$GITHUB_OUTPUT"
          echo "web=$(touches '^(web|test)/')" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}  # skip only on a clear "not touched"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test

  # Renderer tests on the PC, and the firmware must compile. Running it needs the board (smoke.py, locally).
  firmware:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # toolchain + RISC-V target from rust-toolchain.toml
        working-directory: firmware
      - uses: Swatinem/rust-cache@v2 # compiled dependencies, keyed on Cargo.lock: only our crates rebuild
        with:
          workspaces: |
            guards
            firmware
      - run: cargo test
        working-directory: guards
      - run: cargo build --release
        working-directory: firmware

  # Squash merges make the PR title the commit on main, so this keeps main's history conventional.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}  # via env, never inlined: a title could carry shell code
        run: |
          types='feat|fix|perf|refactor|test|ci|build|docs|style|chore|revert'
          scopes='ble|display|firmware|guards|power|page|case|fonts|tools|tests|readme|claude|deps'
          if printf '%s' "$TITLE" | grep -Eq "^($types)(\(($scopes)\))?!?: [^ ].*"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a Conventional Commit: type(scope): summary"
            echo "types:  ${types//|/, }"
            echo "scopes: ${scopes//|/, } (optional)"
            echo "got:    $TITLE"
            exit 1
          fi
