# Tags main with the next SemVer version (vMAJOR.MINOR.PATCH) and publishes a GitHub Release, from the
# Conventional Commits since the last tag (pr-title keeps main's squash commits conventional):
# breaking (`type!:` or a `BREAKING CHANGE:` footer) -> major, feat -> minor, anything else -> patch.
# Every merge gets a tag, so the web app and firmware always show a plain vX.Y.Z, never vX.Y.Z-N-gSHA.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release  # one at a time, so two quick merges can't both claim the same version

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0  # first release
          else
            log=$(git log --format='%s%n%b' "$last"..HEAD)
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -Eq '^[a-z]+(\([^)]*\))?!: |^BREAKING[ -]CHANGE: ' <<< "$log"; then next=v$((major+1)).0.0
            elif grep -Eq '^feat(\([^)]*\))?: ' <<< "$log"; then next=v$major.$((minor+1)).0
            elif [ -n "$log" ]; then next=v$major.$minor.$((patch+1))
            else echo "no commits since $last"; exit 0  # e.g. a manual rerun
            fi
          fi
          echo "releasing $next"
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
